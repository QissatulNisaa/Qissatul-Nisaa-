            <button onclick="navigateTo('index')" class="nav-btn px-3 sm:px-4 py-2 rounded-lg text-sm font-medium text-purple-600 hover:bg-purple-50 transition transform hover:scale-110 tooltip" data-tooltip="Go to Home">Home</button>

            <button onclick="navigateTo('feedback')" class="nav-btn px-3 sm:px-4 py-2 rounded-lg text-sm font-medium text-purple-600 hover:bg-purple-50 transition transform hover:scale-110 tooltip" data-tooltip="Share Feedback">Feedback</button>

        </div>
      </div>
    </nav>

    <div id="mobileMenu" class="fixed top-16 left-0 w-full overflow-hidden max-h-0 transition-all duration-300 bg-white shadow-lg z-40">

      <button onclick="navigateTo('definition')" class="block px-6 py-4">Definition</button>

<div id="storySelectorWrapper" class="min-h-screen">
